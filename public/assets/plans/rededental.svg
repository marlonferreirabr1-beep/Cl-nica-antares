<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72" fill="none">
  <defs>
    <linearGradient id="rd-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A859"/>
      <stop offset="100%" stop-color="#006837"/>
    </linearGradient>
    <linearGradient id="rd-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A859"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Rede Dental Icon: Connected Dental Network Emblem -->
  <g transform="translate(6, 6)">
    <!-- Base soft shield/circle -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#rd-grad)"/>
    
    <!-- Central stylized tooth with network nodes -->
    <!-- Tooth silhouette -->
    <path d="M30 14 C23 14 18 18 18 25 C18 31 21 37 24 45 C25.5 49 28 49 29 45 C29.5 43 29.8 39 30 36 C30.2 39 30.5 43 31 45 C32 49 34.5 49 36 45 C39 37 42 31 42 25 C42 18 37 14 30 14 Z" fill="#FFFFFF"/>
    
    <!-- Inner dynamic smile arc -->
    <path d="M23 27 C26 31 34 31 37 27" stroke="#008542" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Network connection nodes & links -->
    <circle cx="15" cy="30" r="3" fill="#A7F3D0"/>
    <circle cx="45" cy="30" r="3" fill="#A7F3D0"/>
    <circle cx="30" cy="11" r="3" fill="#A7F3D0"/>
    
    <!-- Subtle link lines -->
    <line x1="17" y1="28" x2="21" y2="23" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="43" y1="28" x2="39" y2="23" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(76, 12)">
    <!-- "REDE" -->
    <text x="0" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" font-size="24" font-weight="900" fill="#008542" letter-spacing="-0.3">REDE</text>
    
    <!-- "DENTAL" -->
    <text x="73" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" font-size="24" font-weight="900" fill="#1E293B" letter-spacing="-0.3">DENTAL</text>

    <!-- Subtitle pill bar -->
    <rect x="0" y="34" width="180" height="1.5" fill="url(#rd-accent)"/>
    
    <!-- Subtitle -->
    <text x="0" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" font-size="7.5" font-weight="700" fill="#059669" letter-spacing="2">PLANOS ODONTOLÓGICOS</text>
  </g>
</svg>
